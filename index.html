<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 600px at 15% 20%, rgba(120, 70, 200, 0.45), transparent 60%),
      radial-gradient(900px 500px at 85% 80%, rgba(60, 130, 220, 0.35), transparent 60%),
      linear-gradient(135deg, #1b1030, #2e1b52 45%, #14091f);
    background-attachment: fixed;
    padding: 28px 40px 40px;
  }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 26px;
  }

  .top h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 10px 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    min-width: 190px;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(160deg, #cfd8dc, #90a4ae);
    position: relative;
    overflow: hidden;
  }

  .avatar::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 9px;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    border-radius: 50%;
    background: #546e7a;
  }

  .avatar::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -14px;
    width: 34px;
    height: 26px;
    margin-left: -17px;
    border-radius: 50%;
    background: #546e7a;
  }

  .user b {
    display: block;
    font-size: 15px;
    font-weight: 600;
  }

  .user span {
    font-size: 12px;
    opacity: 0.7;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(6, 120px);
    grid-auto-rows: 120px;
    grid-auto-flow: dense;
    gap: 8px;
    max-width: 760px;
  }

  .tile {
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 10px 12px;
    color: #fff;
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.15s, outline-color 0.15s;
    outline: 2px solid transparent;
    outline-offset: -2px;
  }

  .tile:hover {
    outline-color: rgba(255, 255, 255, 0.75);
    transform: scale(0.985);
  }

  .tile span {
    position: relative;
    z-index: 2;
    font-size: 13px;
    line-height: 1.2;
  }

  .w2 { grid-column: span 2; }
  .h2 { grid-row: span 2; }
  .w4 { grid-column: span 4; }

  .tile.big span { font-size: 17px; }

  .tile svg {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 46px;
    height: 46px;
    transform: translate(-50%, -50%);
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.95;
  }

  .tile.big svg {
    width: 76px;
    height: 76px;
    top: 44%;
  }

  .mail { background: #0b5fa5; }
  .mail span { font-size: 20px; }

  .calendar { background: #6a1b9a; }
  .photos { background: #00796b; }
  .skype { background: #009de0; }
  .people { background: #d35400; }
  .finance { background: #1e7b45; }
  .weather { background: #0277bd; }
  .news { background: #263238; }
  .store { background: #4a7c1f; }
  .ie { background: #0a5fa8; }
  .maps { background: #512da8; }
  .cook { background: #00796b; }
  .camera { background: #b71c1c; }
  .music { background: #e65100; }
  .games { background: #33691e; }
  .help { background: #c75000; }

  .news b {
    position: absolute;
    left: 12px;
    top: 10px;
    font-size: 22px;
    font-weight: 300;
  }

  .news i {
    position: absolute;
    left: 12px;
    bottom: 10px;
    right: 12px;
    font-style: normal;
    font-size: 12px;
    opacity: 0.8;
    line-height: 1.35;
  }

  .news::after {
    content: "";
    position: absolute;
    right: -30px;
    top: -30px;
    width: 150px;
    height: 150px;
    background: linear-gradient(140deg, rgba(255, 255, 255, 0.16), transparent 70%);
  }

  .store b {
    position: absolute;
    right: 14px;
    top: 12px;
    font-size: 34px;
    font-weight: 300;
  }

  .more {
    position: fixed;
    left: 40px;
    bottom: 28px;
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255, 255, 255, 0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    text-decoration: none;
    transition: background 0.15s;
  }

  .more:hover { background: rgba(255, 255, 255, 0.2); }

  @media (max-width: 820px) {
    body { padding: 20px 18px 40px; }
    .tiles { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 96px; }
    .w4 { grid-column: span 2; }
    .w2.h2 { grid-column: span 2; }
  }
</style>
</head>
<body>

<div class="top">
  <h1>Пуск</h1>
  <div class="user">
    <div class="avatar"></div>
    <div>
      <b>test</b>
      <span>Администратор</span>
    </div>
  </div>
</div>

<div class="tiles">

  <a class="tile mail w2 h2 big">
    <svg viewBox="0 0 48 48"><rect x="6" y="12" width="36" height="24"/><path d="M6 12l18 12 18-12"/></svg>
    <span>Почта</span>
  </a>

  <a class="tile calendar">
    <svg viewBox="0 0 48 48"><rect x="8" y="12" width="32" height="28"/><path d="M8 20h32M16 8v8M32 8v8"/></svg>
    <span>Календарь</span>
  </a>

  <a class="tile photos w2">
    <svg viewBox="0 0 48 48"><rect x="6" y="10" width="36" height="28"/><path d="M6 32l12-12 10 10 6-6 8 8"/></svg>
    <span>Фотографии</span>
  </a>

  <a class="tile skype w2">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13"/><path d="M18 26c2 4 8 5 11 1"/></svg>
    <span>Skype</span>
  </a>

  <a class="tile people">
    <svg viewBox="0 0 48 48"><circle cx="19" cy="18" r="6"/><path d="M8 38c0-6 5-9 11-9s11 3 11 9"/><circle cx="33" cy="20" r="5"/><path d="M31 29c6 0 9 3 9 8"/></svg>
    <span>Люди</span>
  </a>

  <a class="tile finance">
    <svg viewBox="0 0 48 48"><path d="M8 34l10-10 7 6 15-16"/><path d="M33 14h7v7"/></svg>
    <span>Финансы</span>
  </a>

  <a class="tile weather w2 h2 big">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M10 10l4 4M34 34l4 4M38 10l-4 4M14 34l-4 4"/></svg>
    <span>Погода</span>
  </a>

  <a class="tile news w4 h2 big">
    <b>Новости</b>
    <i>Заголовки дня, фото и видео<br>обновляются в реальном времени</i>
  </a>

  <a class="tile store w2 h2 big">
    <b>+</b>
    <svg viewBox="0 0 48 48"><path d="M10 16h28l-3 22H13z"/><path d="M18 16a6 6 0 0 1 12 0"/></svg>
    <span>Магазин</span>
  </a>

  <a class="tile ie w2 h2 big">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13"/><path d="M11 24h26M24 11c6 6 6 20 0 26M9 33c10 5 24 3 30-5"/></svg>
    <span>Internet Explorer</span>
  </a>

  <a class="tile maps w2">
    <svg viewBox="0 0 48 48"><path d="M6 14l12-4 12 4 12-4v24l-12 4-12-4-12 4z"/><path d="M18 10v24M30 14v24"/></svg>
    <span>Карты</span>
  </a>

  <a class="tile cook">
    <svg viewBox="0 0 48 48"><path d="M18 8v14M22 8v14M18 22v18M22 22v18"/><path d="M32 8c4 4 4 10 0 14v18"/></svg>
    <span>Кулинария</span>
  </a>

  <a class="tile camera">
    <svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="24" rx="3"/><circle cx="24" cy="26" r="7"/></svg>
    <span>Камера</span>
  </a>

  <a class="tile music">
    <svg viewBox="0 0 48 48"><circle cx="16" cy="34" r="5"/><circle cx="34" cy="30" r="5"/><path d="M21 34V12l18-4v22"/></svg>
    <span>Музыка</span>
  </a>

  <a class="tile games">
    <svg viewBox="0 0 48 48"><rect x="6" y="18" width="36" height="16" rx="8"/><path d="M16 26h6M19 23v6"/><circle cx="31" cy="24" r="2"/><circle cx="35" cy="28" r="2"/></svg>
    <span>Игры</span>
  </a>

  <a class="tile help">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="14"/><path d="M19 19a5 5 0 1 1 6 5v4"/><circle cx="25" cy="33" r="1.6"/></svg>
    <span>Справка</span>
  </a>

</div>

<a class="more" href="#">↓</a>

</body>
</html>
